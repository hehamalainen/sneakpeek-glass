<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SneakPeek Glass</title>
<style>
  /* Additive display: black = transparent. Keep surfaces bounded, never full-bright. */
  :root {
    --fg: #f2f2f2; --dim: #9a9a9a; --surface: #161616; --line: #2a2a2a;
    --ok: #5fe08a; --warn: #ffd166; --bad: #ff6b6b; --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font: 500 clamp(14px, 4.2vmin, 26px)/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 3vmin; padding: 6vmin; }
  header { display: flex; justify-content: space-between; align-items: baseline; color: var(--dim); font-size: .8em; }
  header b { color: var(--fg); letter-spacing: .04em; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 3vmin; padding: 4vmin;
    display: grid; gap: 2vmin; align-content: start; align-self: center; min-block-size: 0; overflow: hidden; }
  .meta { display: flex; gap: 2vmin; align-items: center; flex-wrap: wrap; font-size: .8em; color: var(--dim); }
  .risk { padding: .1em .5em; border-radius: 1em; border: 1.5px solid currentColor; font-weight: 700; text-transform: uppercase; font-size: .75em; }
  .risk.low { color: var(--ok); } .risk.medium { color: var(--warn); } .risk.high { color: var(--bad); }
  .what { font-family: ui-monospace, Menlo, monospace; font-size: .85em; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .intent { color: var(--dim); font-size: .8em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .intent::before { content: "→ heading: "; color: var(--fg); }
  .why { color: var(--bad); font-size: .8em; }
  .actions { display: flex; gap: 2vmin; }
  button { flex: 1; font: inherit; font-weight: 700; color: var(--fg); background: var(--surface);
    border: 2px solid var(--line); border-radius: 2.5vmin; padding: 2.5vmin 1vmin; }
  button:focus-visible, button:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
  button.allow { border-color: var(--ok); } button.deny { border-color: var(--bad); }
  button.confirm { background: #0f2a18; }
  .empty { display: grid; place-items: center; text-align: center; color: var(--dim); }
  .empty strong { display: block; color: var(--ok); font-size: 1.4em; }
  .recent { font-size: .7em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><b>SNEAKPEEK</b><span id="status">connecting…</span></header>

  <section id="empty" class="empty"><div><strong>All clear</strong>No agent is waiting for you.</div></section>

  <section id="card" class="card" hidden aria-live="polite">
    <div class="meta"><span class="risk" id="risk">medium</span><span id="project"></span><span id="tool"></span></div>
    <div class="what" id="what"></div>
    <div class="intent" id="intent"></div>
    <div class="why" id="why"></div>
  </section>

  <footer>
    <div class="actions" id="actions" hidden>
      <button class="deny" id="deny">Deny</button>
      <button id="later">Terminal</button>
      <button class="allow" id="allow">Approve</button>
    </div>
    <div class="recent" id="recent"></div>
  </footer>
</main>

<script>
  // Token: open the app once as https://<relay>/?t=<token>; it is kept in localStorage.
  const qs = new URLSearchParams(location.search);
  let token = qs.get('t');
  try { if (token) localStorage.setItem('sp_token', token); else token = localStorage.getItem('sp_token'); } catch {}
  if (qs.get('t')) history.replaceState(null, '', location.pathname); // keep token out of the visible URL

  const $ = (id) => document.getElementById(id);
  let current = null, armedUntil = 0, queueLen = 0, inFlight = false;

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-sneakpeek-token': token || '', ...(opts.headers || {}) } });
    if (!r.ok) throw Object.assign(new Error((await r.json().catch(() => ({}))).error || r.status), { status: r.status });
    return r.json();
  }

  function render(items, recent) {
    queueLen = items.length;
    const next = items[0] || null;
    $('status').textContent = queueLen ? `${queueLen} waiting` : 'watching';
    $('recent').textContent = recent.length
      ? 'last: ' + recent.map(r => `${r.decision === 'allow' ? '✓' : r.decision === 'deny' ? '✕' : '…'} ${r.project}`).join('  ')
      : '';

    if (!next) { current = null; $('card').hidden = $('actions').hidden = true; $('empty').hidden = false; return; }
    if (current && current.id === next.id) return; // don't steal focus mid-decision

    current = next; disarm();
    $('empty').hidden = true; $('card').hidden = $('actions').hidden = false;
    $('risk').textContent = next.risk; $('risk').className = 'risk ' + next.risk;
    $('project').textContent = next.project; $('tool').textContent = next.tool;
    $('what').textContent = next.summary || '(no summary)';
    $('intent').textContent = next.intent; $('intent').hidden = !next.intent;
    $('why').textContent = next.risk === 'high' ? `⚠ ${next.riskReasons.join(', ')} — approve at terminal` : '';
    $('allow').hidden = next.risk === 'high';
    // Safe default: focus lands on "Terminal" so a stray pinch never approves.
    $('later').focus();
  }

  function disarm() { armedUntil = 0; $('allow').textContent = 'Approve'; $('allow').classList.remove('confirm'); }

  async function decide(decision) {
    if (!current || inFlight) return;
    inFlight = true;
    try { await api(`/api/requests/${current.id}/decision`, { method: 'POST', body: JSON.stringify({ decision }) }); }
    catch (e) { $('status').textContent = 'error: ' + e.message; }
    finally { inFlight = false; current = null; poll(); }
  }

  $('deny').addEventListener('click', () => decide('deny'));
  $('later').addEventListener('click', () => decide('defer'));
  $('allow').addEventListener('click', () => {
    // Two-step approve: first activation arms, second within 3 s commits.
    if (Date.now() < armedUntil) { disarm(); decide('allow'); return; }
    armedUntil = Date.now() + 3000;
    $('allow').textContent = 'Confirm ✓'; $('allow').classList.add('confirm');
    setTimeout(() => { if (Date.now() >= armedUntil) disarm(); }, 3100);
  });

  // Fallback for desktop preview: the glasses do native spatial navigation; if focus
  // didn't move after the browser's own handling, step through the visible buttons.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const before = document.activeElement;
    setTimeout(() => {
      if (document.activeElement !== before) return;
      const btns = [...document.querySelectorAll('#actions button')].filter(b => !b.hidden);
      const i = btns.indexOf(before);
      if (i === -1) return;
      const next = btns[Math.max(0, Math.min(btns.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)))];
      next.focus();
    }, 0);
  });

  async function poll() {
    if (!token) { $('status').textContent = 'no token — open with ?t='; return; }
    try { const d = await api('/api/pending'); render(d.items, d.recent); }
    catch (e) { $('status').textContent = e.status === 401 ? 'bad token' : 'offline'; }
  }

  // Polling is the safe baseline (WebSocket/SSE support on-glasses isn't documented yet).
  poll();
  setInterval(() => { if (!inFlight) poll(); }, 1500);
</script>
</body>
</html>
