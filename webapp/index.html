<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SneakPeek Glass</title>
<style>
  :root { color-scheme: dark; font: 500 clamp(16px, 4vmin, 26px)/1.32 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: black; color: #f3f4f4; }
  main { margin: auto; max-width: 30rem; height: 100vh; height: 100dvh; padding: 6vmin;
    display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: .7rem; }
  header, .meta, .actions { display: flex; align-items: center; gap: .5rem; }
  header { justify-content: space-between; font-size: .8rem; color: #b9bfc2; }
  header b { color: white; letter-spacing: .08em; }
  article { align-self: center; min-width: 0; padding: 1rem; border: 1px solid #444;
    border-radius: .7rem; background: #121414; overflow-wrap: anywhere; }
  .meta { flex-wrap: wrap; font-size: .8rem; }
  #risk { padding: .12em .5em; border: 1px solid currentColor; border-radius: 1em; color: #83e4aa; }
  #risk.high { color: #ffd184; }
  #what { margin: .7rem 0; font: 500 .94rem/1.3 ui-monospace, monospace; }
  #context, #recent { color: #b9bfc2; font-size: .74rem; }
  .empty { align-self: center; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .25em; }
  #hint { font-size: .85rem; color: #b9bfc2; margin: 0; }
  button { flex: 1; background: #161818; color: white; padding: .6rem .2rem; font: 650 .95rem system-ui;
    border: 2px solid #777; border-radius: .48rem; }
  #deny { border-color: #ed8986; } #allow { border-color: #83e4aa; }
  button:focus { outline: 3px solid white; outline-offset: 3px; }
  #allow.armed { background: #153b23; }
  #recent { min-height: 1.4em; margin-top: .45rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<header><b>SNEAKPEEK</b><span id="status" role="status">Connecting</span></header>
<section id="empty" class="empty"><h1 id="headline">Connecting</h1><p id="hint">Checking the relay…</p></section>
<article id="card" hidden aria-live="polite">
  <div class="meta"><b id="risk"></b><span id="tool"></span></div>
  <p id="what"></p><div id="context"></div>
</article>
<footer>
  <div id="actions" class="actions" hidden>
    <button id="deny">Deny</button><button id="later">Terminal</button><button id="allow">Approve</button>
  </div>
  <div id="recent" role="status"></div>
</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const storageKey = 'sneakpeek.viewer';
let token, current, confirmTimer, armedUntil = 0, generation = 0, pollTimer;
let busy = false;
async function api(route, key, body) {
  const response = await fetch(route, {
    method: body ? 'POST' : 'GET', redirect: 'error',
    headers: { 'x-sneakpeek-token': key, 'content-type': 'application/json' },
    body: body && JSON.stringify(body), signal: AbortSignal.timeout(6000),
  });
  if (!response.ok) throw Object.assign(new Error(), { status: response.status });
  return response.json();
}
function disarm() {
  clearTimeout(confirmTimer);
  armedUntil = 0;
  $('allow').classList.remove('armed');
  $('allow').textContent = 'Approve';
}
function message(title, hint, status) {
  current = null;
  disarm();
  $('actions').hidden = $('card').hidden = true;
  $('empty').hidden = false;
  $('headline').textContent = title;
  $('hint').textContent = hint;
  $('status').textContent = status;
}
function render({items, recent}) {
  const next = items[0];
  const last = recent[0];
  const verbs = { allow: 'Approved', deny: 'Denied', defer: 'Deferred' };
  $('recent').textContent = last ? verbs[last.decision] + ' · ' + last.project : '';
  if (!next) return message('All clear', 'No permission requests are waiting.', 'Connected');
  $('status').textContent = items.length + ' waiting';
  if (current?.id === next.id) return;
  disarm();
  current = next;
  $('empty').hidden = true;
  $('card').hidden = $('actions').hidden = false;
  const restricted = next.risk !== 'low';
  $('allow').hidden = restricted;
  $('risk').className = restricted ? 'high' : '';
  $('risk').textContent = restricted ? 'Terminal approval' : 'Read only';
  $('tool').textContent = next.tool;
  $('what').textContent = next.summary;
  $('context').textContent = next.project + ' · session ' + next.session;
  $('later').focus();
}
async function poll() {
  clearTimeout(pollTimer);
  if (busy || document.hidden || !token) return;
  const epoch = ++generation;
  try {
    const data = await api('/api/pending', token);
    if (epoch === generation) render(data);
  } catch (err) {
    if (epoch !== generation) return;
    if (err.status === 401) {
      token = null;
      message('Pair this display', 'Open a fresh pairing link from the relay owner.', 'Unpaired');
    } else message('Relay offline', 'Check the Mac or use Claude Code.', 'Reconnecting');
  } finally {
    if (epoch === generation && token) pollTimer = setTimeout(poll, 1500);
  }
}
async function decide(decision) {
  if (!current || busy || document.hidden) return;
  const id = current.id;
  busy = true;
  ++generation;
  clearTimeout(pollTimer);
  message('Sending decision', '', 'Sending');
  try { await api('/api/requests/' + id + '/decision', token, {decision}); }
  catch { $('recent').textContent = 'Decision unconfirmed. Check Claude Code.'; }
  finally { busy = false; await poll(); }
}
$('later').onclick = () => decide('defer');
$('deny').onclick = () => decide('deny');
$('allow').onclick = () => {
  if (current?.risk !== 'low') return;
  if (performance.now() < armedUntil) return decide('allow');
  disarm();
  armedUntil = performance.now() + 3000;
  $('allow').textContent = 'Confirm';
  $('allow').classList.add('armed');
  confirmTimer = setTimeout(disarm, 3000);
};
$('allow').onblur = disarm;
window.addEventListener('blur', disarm);
document.addEventListener('keydown', event => {
  if (event.repeat && ['Enter', ' '].includes(event.key)) { event.preventDefault(); return; }
  if (!['ArrowRight', 'ArrowLeft'].includes(event.key) || !current) return;
  const buttons = [...$('actions').querySelectorAll('button')].filter(b => !b.hidden);
  const i = buttons.indexOf(document.activeElement);
  if (i < 0) return;
  event.preventDefault();
  buttons[Math.max(0, Math.min(buttons.length - 1, i + (event.key === 'ArrowRight' ? 1 : -1)))].focus();
});
document.addEventListener('visibilitychange', () => {
  ++generation;
  clearTimeout(pollTimer);
  if (document.hidden) message('Paused', '', 'Paused');
  else if (token) poll();
  else message('Pair this display', 'Open a fresh pairing link from the relay owner.', 'Unpaired');
});
async function start() {
  const code = new URLSearchParams(location.hash.slice(1)).get('pair');
  if (location.hash) history.replaceState(null, '', location.pathname);
  if (code) {
    try {
      ({ token } = await api('/api/pair', code, {}));
      try { localStorage.setItem(storageKey, token); } catch { /* usable until reload */ }
    } catch { return message('Pairing failed', 'Check the relay and open a fresh pairing link.', 'Unpaired'); }
  } else {
    try { token = localStorage.getItem(storageKey); } catch {}
  }
  if (!token) return message('Pair this display', 'Open the pairing link from the relay owner.', 'Unpaired');
  await poll();
}
start();
</script>
</body>
</html>
